name: BlockCraft Guest Transport and SCTP CRC32c fixed probe

on:
  push:
    branches:
      - experiment/netease-room-discovery
    paths:
      - 'experiments/netease-room-discovery/GuestTransportLab/**'
      - '.github/workflows/netease-guest-transport.yml'
  pull_request:
    paths:
      - 'experiments/netease-room-discovery/GuestTransportLab/**'
      - '.github/workflows/netease-guest-transport.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guest-transport-selftest:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experiments/netease-room-discovery/GuestTransportLab
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Resolve reproducible dependencies for this build
        shell: pwsh
        run: go mod tidy

      - name: Prepare RFC4960 CRC32c compiler overlay for pinned SCTP fork
        shell: pwsh
        run: |
          & "./tools/create-sctp-crc32c-overlay.ps1" -OutPath ".blockcraft/nethernet-fork"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Unit tests and local-only WebRTC guest-host handshake
        shell: pwsh
        run: |
          go test -count=1 -timeout=90s ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build standalone Windows companion EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist" | Out-Null
          go build -trimpath -ldflags="-s -w" -o "dist/BlockCraft.GuestTransportLab.exe" ./cmd/guestlab
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -ldflags="-s -w" -o "dist/BlockCraft.JoinProbe.exe" ./cmd/joinprobe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test unsigned EXE (loopback only)
        shell: pwsh
        run: |
          & "dist/BlockCraft.GuestTransportLab.exe" -selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "dist/BlockCraft.GuestTransportLab.exe" -protocol-selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage9 join probe safe no-credentials smoke test
        shell: pwsh
        run: |
          & "dist/BlockCraft.JoinProbe.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Stage9 lobby join probe
        uses: actions/upload-artifact@v4
        with:
          name: BlockCraft-Stage9-JoinProbe-win
          path: experiments/netease-room-discovery/GuestTransportLab/dist/BlockCraft.JoinProbe.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows transport lab
        uses: actions/upload-artifact@v4
        with:
          name: BlockCraft-GuestTransportLab-win-unsigned
          path: experiments/netease-room-discovery/GuestTransportLab/dist/BlockCraft.GuestTransportLab.exe
          if-no-files-found: error
          retention-days: 7
