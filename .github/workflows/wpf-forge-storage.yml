name: Verify Forge selection and custom storage on Windows

on:
  push:
    branches: [feature/v0964-forge-storage]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
        working-directory: wpf-net48
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build WPF, the standalone EXE and the full distribution
        shell: cmd
        run: call build\build-windows.bat
      - name: Verify builds, storage and downloads in both packaging modes
        run: |
          python tests/check_phase2.py
          if ($LASTEXITCODE -ne 0) { throw 'Launcher integration checks failed' }
          $wpf = (Get-Item 'src/BlockCraftLauncher.Wpf/bin/Release/net48/BlockCraftLauncher.Wpf.exe').FullName
          $exe = (Get-Item 'dist/BlockCraftLauncher-v0.9.64-WPF-OneFile-Windows-x64.exe').FullName
          function Run-Probe($binary, $flag, $timeout) {
            $process = Start-Process -FilePath $binary -ArgumentList $flag -WindowStyle Hidden -PassThru
            try {
              if (!$process.WaitForExit($timeout * 1000)) {
                $process.Kill($true)
                throw "$flag timed out after $timeout seconds"
              }
              $process.Refresh()
              if ($process.ExitCode -ne 0) {
                foreach ($log in @('wpf-preview-logs/startup-error.log', 'onefile/bootstrap-error.log')) {
                  $path = Join-Path $env:LOCALAPPDATA "BlockCraftLauncher/$log"
                  if (Test-Path -LiteralPath $path) { Get-Content -LiteralPath $path -Tail 40 -Encoding utf8 }
                }
                throw "$binary $flag failed with exit code $($process.ExitCode)"
              }
              Write-Host "PASS $binary $flag"
            } finally { $process.Dispose() }
          }
          $env:BLOCKCRAFT_UI_CAPTURE_DIR = Join-Path $env:RUNNER_TEMP 'forge-storage-checks'
          $null = New-Item -ItemType Directory -Path $env:BLOCKCRAFT_UI_CAPTURE_DIR -Force
          foreach ($binary in @($wpf, $exe)) {
            foreach ($flag in @('--download-selftest', '--download-ui-selftest', '--qwen-download-selftest', '--smoke-test')) {
              Run-Probe $binary $flag 180
            }
          }

          # The fixture starts from settings whose game root points to AppData.
          # Use a different Windows drive for the chosen download directory.
          $testStorage = Join-Path $env:RUNNER_TEMP 'forge-game-storage'
          $null = New-Item -ItemType Directory -Path $testStorage -Force
          $drive = $null
          if ([IO.Path]::GetPathRoot($testStorage) -eq [IO.Path]::GetPathRoot($env:APPDATA)) {
            $drive = @(90..70 | ForEach-Object { ([char]$_).ToString() + ':' } | Where-Object { !(Test-Path "$_\") })[0]
            if (!$drive) { throw 'No drive letter available for the cross-volume fixture' }
            subst $drive $testStorage
            if ($LASTEXITCODE -ne 0) { throw 'Could not mount the alternate fixture drive' }
            $testStorage = "$drive\"
          }
          try {
            $env:BLOCKCRAFT_STORAGE_TEST_PARENT = $testStorage
            foreach ($probe in @(
              @{ flag = '--qwen-game-live-check'; report = 'qwen-live-game-check.txt'; timeout = 520 },
              @{ flag = '--forge-install-live-check'; report = 'forge-install-live-check.txt'; timeout = 1200 }
            )) {
              Run-Probe $exe $probe.flag $probe.timeout
              Get-Content -LiteralPath (Join-Path $env:BLOCKCRAFT_UI_CAPTURE_DIR $probe.report) -Encoding utf8 -ErrorAction Stop
            }
          } finally {
            if ($drive) { subst $drive /D }
          }
      - name: Prepare SHA-256 manifest for both distributions
        run: |
          $exe = 'BlockCraftLauncher-v0.9.64-WPF-OneFile-Windows-x64.exe'
          $zip = 'BlockCraftLauncher-v0.9.64-WPF-net48-Alpha-Windows-x64.zip'
          $lines = foreach ($name in @($exe, $zip)) {
            $hash = (Get-FileHash -LiteralPath "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          if ((Get-Content -LiteralPath "dist/$exe.sha256" -Raw).Trim() -cne $lines[0]) {
            throw 'OneFile SHA-256 sidecar does not match the tested executable'
          }
          $lines | Set-Content -LiteralPath 'dist/RELEASE-SHA256SUMS.txt' -Encoding ascii
          $lines | Write-Output
      - uses: actions/upload-artifact@v4
        with:
          name: BlockCraftLauncher-v0.9.64-Forge-Storage-Windows-x64
          path: |
            wpf-net48/dist/*-WPF-OneFile-Windows-x64.exe
            wpf-net48/dist/*-WPF-OneFile-Windows-x64.exe.sha256
            wpf-net48/dist/*-WPF-net48-Alpha-Windows-x64.zip
            wpf-net48/dist/RELEASE-SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
