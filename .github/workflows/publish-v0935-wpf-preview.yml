name: Publish verified v0.9.35 WPF preview

on:
  push:
    branches:
      - release/v0.9.35-wpf-rc.1
    paths:
      - .github/workflows/publish-v0935-wpf-preview.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: release-v0935-wpf-preview
  cancel-in-progress: false

jobs:
  publish-preview:
    if: github.repository == 'minecraftlu/BlockCraftLauncher'
    runs-on: windows-2022
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
    env:
      BCL_TAG: v0.9.35-wpf-rc.1
      BCL_SOURCE: f29a463d1abf9b77bb28e7bf7987e8ff557ef4a6
      BCL_SINGLE: BlockCraftLauncher-v0.9.35-WPF-OneFile-Windows-x64.exe
      BCL_ZIP: BlockCraftLauncher-v0.9.35-WPF-net48-Alpha-Windows-x64.zip
      BCL_SINGLE_SHA: 332a421eecf448cfb685464eac0266beedb0695558ea09858085bebcc670a44d
      BCL_ZIP_SHA: 5ddafab91c503ca5d768858f899d7e5fbedc52a040b8b0040f7ed0fb414e9b96
      BCL_OLD_TAG: v0.9.34-wpf-rc.1
      BCL_OLD_SINGLE: BlockCraftLauncher-v0.9.34-WPF-OneFile-Windows-x64.exe
      BCL_OLD_ZIP: BlockCraftLauncher-v0.9.34-WPF-net48-Alpha-Windows-x64.zip
      BCL_OLD_SINGLE_SHA: 78735040ac744124ffece2fa9f5ecbaa0d61ba411bf619ffd54aa39c9a50a9b4
      BCL_OLD_ZIP_SHA: 3f7608fd004ccbd6cbc460776d2d95be9b5d901daacd30d1e82f4c8d71ceb306
    steps:
      - name: Retrieve the tested packages and the previous public preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:RUNNER_TEMP 'bcl-candidate'
          $legacy = Join-Path $env:RUNNER_TEMP 'bcl-legacy'
          $run = 42788551084
          $build = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$run"
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve the Windows build metadata' }
          $build = $build | ConvertFrom-Json
          if ($build.head_sha -ne $env:BCL_SOURCE -or $build.status -ne 'completed' -or
              $build.conclusion -ne 'success' -or $build.path -ne '.github/workflows/wpf-net48-alpha-build.yml') {
            throw 'The Windows build does not match the tested revision'
          }
          gh run download $run --repo $env:GITHUB_REPOSITORY --dir $dist `
            --name 'BlockCraftLauncher-v0.9.35-WPF-net48-Windows-Alpha'
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the tested v0.9.35 artifact' }
          gh release download $env:BCL_OLD_TAG --repo $env:GITHUB_REPOSITORY --dir $legacy `
            --pattern $env:BCL_OLD_SINGLE --pattern $env:BCL_OLD_ZIP
          if ($LASTEXITCODE -ne 0) { throw 'Could not download both public v0.9.34 packages' }

          function Assert-Sha256($file, $expected) {
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $expected) {
              throw "SHA-256 mismatch for $(Split-Path $file -Leaf)"
            }
          }
          Assert-Sha256 (Join-Path $dist $env:BCL_SINGLE) $env:BCL_SINGLE_SHA
          Assert-Sha256 (Join-Path $dist $env:BCL_ZIP) $env:BCL_ZIP_SHA
          Assert-Sha256 (Join-Path $legacy $env:BCL_OLD_SINGLE) $env:BCL_OLD_SINGLE_SHA
          Assert-Sha256 (Join-Path $legacy $env:BCL_OLD_ZIP) $env:BCL_OLD_ZIP_SHA
          $singleSum = (Get-Content -LiteralPath (Join-Path $dist "$env:BCL_SINGLE.sha256") -Raw).Trim()
          if ($singleSum -ne "$env:BCL_SINGLE_SHA  $env:BCL_SINGLE") { throw 'Unexpected EXE sidecar hash' }
          [IO.File]::WriteAllLines((Join-Path $dist 'RELEASE-SHA256SUMS.txt'),
            [string[]]@("$env:BCL_SINGLE_SHA  $env:BCL_SINGLE", "$env:BCL_ZIP_SHA  $env:BCL_ZIP"),
            [Text.Encoding]::ASCII)
          @'
          Windows x64 · .NET Framework 4.8 · 预览版

          - 「版本设置 → 模组与资源」显示 Forge、NeoForge、Fabric、Quilt 和旧版模组的自带图标。
          - 停用模组也显示图标。缺少可用图片时显示默认方块，离线也可用。
          - 在「设置 → 更新设置」选择「预览版」并保存，即可在「启动器更新」检查新版。

          [Windows 构建与图标测试](https://github.com/minecraftlu/BlockCraftLauncher/actions/runs/42788551084)
          '@ | Set-Content -LiteralPath (Join-Path $dist 'RELEASE-NOTES.txt') -Encoding utf8

      - name: Preflight the v0.9.34 channel and ZIP compatibility
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:RUNNER_TEMP 'bcl-candidate'
          $legacy = Join-Path $env:RUNNER_TEMP 'bcl-legacy'
          $page = "https://github.com/$env:GITHUB_REPOSITORY/releases"
          $names = @($env:BCL_SINGLE, $env:BCL_ZIP, 'RELEASE-SHA256SUMS.txt')
          $candidate = @(@{
            tag_name = $env:BCL_TAG
            prerelease = $true
            draft = $false
            html_url = "$page/tag/$env:BCL_TAG"
            assets = @($names | ForEach-Object {
              @{ name = $_; size = (Get-Item -LiteralPath (Join-Path $dist $_)).Length;
                 browser_download_url = "$page/download/$env:BCL_TAG/$_" }
            })
          })
          $fixture = Join-Path $legacy 'candidate.json'
          ConvertTo-Json -InputObject $candidate -Depth 6 -Compress | Set-Content -LiteralPath $fixture -Encoding utf8

          $unpacked = Join-Path $legacy 'unpacked'
          Expand-Archive -LiteralPath (Join-Path $legacy $env:BCL_OLD_ZIP) -DestinationPath $unpacked
          $oldWpf = @(Get-ChildItem -LiteralPath $unpacked -Recurse -File -Filter 'BlockCraftLauncher.Wpf.exe')
          if ($oldWpf.Count -ne 1) { throw 'Expected one v0.9.34 WPF payload' }
          $oldRoot = $oldWpf[0].DirectoryName
          $probe = Join-Path $oldRoot 'ReleaseProbe.exe'
          $source = Join-Path $legacy 'ReleaseProbe.cs'
          @'
          using System;
          using System.Diagnostics;
          using System.IO;
          using System.Linq;
          using System.Reflection;
          using System.Threading;
          using BlockCraftLauncher.Wpf.Models;
          using BlockCraftLauncher.Wpf.Services;

          public static class ReleaseProbe
          {
              static void Preflight(string tag, string fixture, string archive, string output)
              {
                  string json = File.ReadAllText(fixture);
                  foreach (string mode in new[] { "zip", "onefile" })
                  {
                      var offer = LauncherAutoUpdateService.SelectOffer(json, "preview", mode);
                      if (offer == null || offer.Tag != tag ||
                          LauncherAutoUpdateService.SelectOffer(json, "stable", mode) != null ||
                          LauncherAutoUpdateService.SelectOffer(json, "preview", mode, tag) != null)
                          throw new InvalidOperationException("Wrong channel selection for " + mode);
                  }

                  var type = typeof(LauncherAutoUpdateService);
                  const BindingFlags methods = BindingFlags.Static | BindingFlags.NonPublic;
                  string stage = (string)type.GetMethod("ExtractCheckedZip", methods)
                      .Invoke(null, new object[] { archive, output });
                  type.GetMethod("VerifyZipManifest", methods).Invoke(null, new object[] { stage });
                  Console.WriteLine("PASS: v0.9.34 selects both preview assets and verifies the v0.9.35 ZIP");
              }

              static void Upgrade(string mode, string tag, string sha256, string bootstrap, string signal)
              {
                  Environment.SetEnvironmentVariable("BLOCKCRAFT_SINGLEFILE_BOOTSTRAP", mode == "onefile" ? bootstrap : null);
                  if (LauncherAutoUpdateService.InstallMode != mode)
                      throw new InvalidOperationException("Unexpected install mode");
                  var updater = new LauncherAutoUpdateService(new LauncherConfig { UpdateChannel = "preview" });
                  using (var deadline = new CancellationTokenSource(TimeSpan.FromSeconds(140)))
                  {
                      LauncherUpdateOffer offer = null;
                      for (int attempt = 0; attempt < 12; attempt++)
                      {
                          offer = updater.CheckAsync(deadline.Token).GetAwaiter().GetResult();
                          if (offer != null && offer.Tag == tag) break;
                          Thread.Sleep(4000);
                      }
                      if (offer == null || offer.Tag != tag)
                          throw new InvalidOperationException("Public preview feed did not offer " + tag);
                      var prepared = updater.PrepareAsync(offer, deadline.Token).GetAwaiter().GetResult();
                      if (!string.Equals(prepared.Sha256, sha256, StringComparison.OrdinalIgnoreCase))
                          throw new InvalidOperationException("Prepared update hash mismatch");
                      Console.WriteLine("PASS: v0.9.34 " + mode + " detected, downloaded and verified " + tag);

                      string updates = Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData),
                          "BlockCraftLauncher", "updates");
                      var before = Directory.GetDirectories(updates, "runner-*");
                      updater.StartExternalInstaller(prepared);
                      string runner = Directory.GetDirectories(updates, "runner-*").Except(before).Single();
                      File.WriteAllText(signal + ".tmp", Path.Combine(runner, "BlockCraftLauncher.Updater.exe"));
                      File.Move(signal + ".tmp", signal);
                      // Leave the old process alive until the harness holds the real installer handle.
                      var wait = Stopwatch.StartNew();
                      while (!File.Exists(signal + ".go") && wait.Elapsed < TimeSpan.FromSeconds(15))
                          Thread.Sleep(100);
                      if (!File.Exists(signal + ".go")) throw new TimeoutException("Could not attach to updater");
                  }
              }

              public static int Main(string[] args)
              {
                  try
                  {
                      if (args[0] == "fixture") Preflight(args[1], args[2], args[3], args[4]);
                      else Upgrade(args[0], args[1], args[2], args[3], args[4]);
                      return 0;
                  }
                  catch (Exception error)
                  {
                      Console.Error.WriteLine(error);
                      return 1;
                  }
              }
          }
          '@ | Set-Content -LiteralPath $source -Encoding utf8
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /target:exe /platform:x64 "/out:$probe" "/reference:$($oldWpf[0].FullName)" $source
          if ($LASTEXITCODE -ne 0) { throw 'Could not compile the updater probe' }
          Copy-Item -LiteralPath ($oldWpf[0].FullName + '.config') -Destination ($probe + '.config')
          $checked = Join-Path $dist 'checked-zip'
          & $probe fixture $env:BCL_TAG $fixture (Join-Path $dist $env:BCL_ZIP) $checked
          if ($LASTEXITCODE -ne 0) { throw 'v0.9.34 preflight failed' }
          $newWpf = @(Get-ChildItem -LiteralPath $checked -Recurse -File -Filter 'BlockCraftLauncher.Wpf.exe')
          if ($newWpf.Count -ne 1) { throw 'Expected one verified v0.9.35 WPF payload' }

          $settings = Join-Path $env:APPDATA 'BlockCraftLauncher/settings.wpf-preview.json'
          if (Test-Path -LiteralPath $settings) { throw 'Expected a clean Windows runner settings profile' }
          New-Item -ItemType Directory -Path (Split-Path $settings) -Force | Out-Null
          '{"auto_check_updates":false,"update_channel":"preview","account_mode":"offline"}' |
            Set-Content -LiteralPath $settings -Encoding utf8
          $bootstrap = Join-Path $legacy $env:BCL_OLD_SINGLE
          $start = Start-Process -FilePath $bootstrap -ArgumentList '--smoke-test' -PassThru
          if (-not $start.WaitForExit(70000)) { $start.Kill(); throw 'v0.9.34 OneFile preflight timed out' }
          if ($start.ExitCode -ne 0) { throw 'v0.9.34 OneFile preflight failed' }
          $cache = Join-Path $env:LOCALAPPDATA 'BlockCraftLauncher/onefile'
          $oldCache = @(Get-ChildItem -LiteralPath $cache -Directory -Filter 'v0.9.34-*')
          if ($oldCache.Count -ne 1 -or -not (Test-Path -LiteralPath (Join-Path $oldCache[0].FullName '.blockcraft-ready'))) {
            throw 'Could not locate the extracted v0.9.34 OneFile payload'
          }
          Copy-Item -LiteralPath $probe, ($probe + '.config') -Destination $oldCache[0].FullName
          "BCL_ZIP_PROBE=$probe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BCL_SINGLE_PROBE=$(Join-Path $oldCache[0].FullName 'ReleaseProbe.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BCL_OLD_BOOTSTRAP=$bootstrap" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BCL_NEW_WPF_SHA=$((Get-FileHash -LiteralPath $newWpf[0].FullName -Algorithm SHA256).Hash)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish and check the v0.9.35 preview assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $dist = Join-Path $env:RUNNER_TEMP 'bcl-candidate'
          $assets = @($env:BCL_SINGLE, $env:BCL_ZIP, 'RELEASE-SHA256SUMS.txt', "$env:BCL_SINGLE.sha256")
          $files = @($assets | ForEach-Object { Join-Path $dist $_ })
          $releasePath = "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:BCL_TAG"
          $published = gh api $releasePath 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:BCL_TAG @files --repo $env:GITHUB_REPOSITORY --prerelease --latest=false `
              --target $env:BCL_SOURCE --title "BlockCraft Launcher v0.9.35 RC1 预览版" `
              --notes-file (Join-Path $dist 'RELEASE-NOTES.txt')
            if ($LASTEXITCODE -ne 0) { throw 'GitHub prerelease publication failed' }
            $published = gh api $releasePath
            if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve the published preview' }
          }
          $published = $published | ConvertFrom-Json
          if ($published.tag_name -ne $env:BCL_TAG -or $published.draft -or -not $published.prerelease -or
              $published.assets.Count -ne $assets.Count) { throw 'Unexpected release status or asset count' }
          $ref = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:BCL_TAG"
          if ($LASTEXITCODE -ne 0 -or ($ref | ConvertFrom-Json).object.sha -ne $env:BCL_SOURCE) {
            throw 'Published tag does not point to the tested revision'
          }
          foreach ($name in $assets) {
            $asset = @($published.assets | Where-Object name -eq $name)
            $expected = (Get-FileHash -LiteralPath (Join-Path $dist $name) -Algorithm SHA256).Hash
            if ($asset.Count -ne 1 -or $asset[0].digest -ne "sha256:$expected") {
              throw "Published digest mismatch for $name"
            }
          }
          Write-Host "PASS: published $($published.html_url) with the original Windows artifacts"

      - name: Upgrade v0.9.34 ZIP and OneFile from the public preview feed
        run: |
          $ErrorActionPreference = 'Stop'
          $zipTarget = Split-Path $env:BCL_ZIP_PROBE
          $keep = Join-Path $zipTarget 'release-probe.keep'
          'unmanaged file in the old install' | Set-Content -LiteralPath $keep

          function Test-Upgrade($mode, $probe, $sha, $bootstrap) {
            $signal = Join-Path $env:RUNNER_TEMP "bcl-$mode-installer.txt"
            $info = [Diagnostics.ProcessStartInfo]::new($probe)
            $info.UseShellExecute = $false
            $info.WorkingDirectory = Split-Path $probe
            $info.RedirectStandardOutput = $true
            $info.RedirectStandardError = $true
            foreach ($arg in @($mode, $env:BCL_TAG, $sha, $bootstrap, $signal)) { $info.ArgumentList.Add($arg) }
            $old = [Diagnostics.Process]::Start($info)
            $stdout = $old.StandardOutput.ReadToEndAsync()
            $stderr = $old.StandardError.ReadToEndAsync()
            $installer = $null
            $main = $null
            try {
              $watch = [Diagnostics.Stopwatch]::StartNew()
              while (-not (Test-Path -LiteralPath $signal) -and -not $old.HasExited -and $watch.Elapsed.TotalSeconds -lt 150) {
                Start-Sleep -Milliseconds 100
              }
              if (-not (Test-Path -LiteralPath $signal)) { throw "$mode did not prepare the public update" }
              $helper = Get-Content -LiteralPath $signal -Raw
              $helpers = @(Get-Process -Name 'BlockCraftLauncher.Updater' -ErrorAction SilentlyContinue |
                Where-Object { $_.Path -eq $helper })
              if ($helpers.Count -ne 1) { throw "$mode updater helper process was not started" }
              $installer = $helpers[0]
              $null = $installer.Handle
              New-Item -ItemType File -Path "$signal.go" | Out-Null
              if (-not $old.WaitForExit(10000) -or $old.ExitCode -ne 0) { throw "$mode old update probe failed" }
              if (-not $installer.WaitForExit(125000) -or $installer.ExitCode -ne 0) {
                throw "$mode external update helper did not finish successfully"
              }

              if ($mode -eq 'zip') {
                $main = Join-Path $zipTarget 'BlockCraftLauncher.Wpf.exe'
                if ((Get-Content -LiteralPath $keep -Raw).Trim() -ne 'unmanaged file in the old install') {
                  throw 'ZIP update changed an unmanaged file in the install folder'
                }
              } else {
                if ((Get-FileHash -LiteralPath $bootstrap -Algorithm SHA256).Hash -ne $sha) {
                  throw 'OneFile update did not replace the original bootstrap'
                }
                $cache = Join-Path $env:LOCALAPPDATA 'BlockCraftLauncher/onefile'
                $newCache = @(Get-ChildItem -LiteralPath $cache -Directory -Filter 'v0.9.35-*')
                if ($newCache.Count -ne 1) { throw 'Expected one v0.9.35 OneFile payload' }
                $main = Join-Path $newCache[0].FullName 'BlockCraftLauncher.Wpf.exe'
              }
              if ((Get-FileHash -LiteralPath $main -Algorithm SHA256).Hash -ne $env:BCL_NEW_WPF_SHA) {
                throw "$mode installed an unexpected WPF executable"
              }
              $windows = @(Get-Process -Name 'BlockCraftLauncher.Wpf' -ErrorAction SilentlyContinue |
                Where-Object { $_.Path -eq $main -and $_.MainWindowHandle -ne [IntPtr]::Zero })
              if ($windows.Count -ne 1) { throw "$mode did not reopen the v0.9.35 main window" }
              Write-Host "PASS: v0.9.34 $mode installed v0.9.35 and reopened the main window"
            } finally {
              if (-not $old.HasExited) { $old.Kill(); $old.WaitForExit() }
              if ($installer) {
                if (-not $installer.HasExited) { $installer.Kill() }
                $installer.Dispose()
              }
              if ($main) {
                Get-Process -Name 'BlockCraftLauncher.Wpf' -ErrorAction SilentlyContinue |
                  Where-Object { $_.Path -eq $main } | Stop-Process -Force
              }
              if ($stdout.Wait(2000) -and $stdout.Result) { Write-Host $stdout.Result.Trim() }
              if ($stderr.Wait(2000) -and $stderr.Result) { Write-Host $stderr.Result.Trim() }
              $old.Dispose()
            }
          }
          Test-Upgrade 'zip' $env:BCL_ZIP_PROBE $env:BCL_ZIP_SHA '-'
          Test-Upgrade 'onefile' $env:BCL_SINGLE_PROBE $env:BCL_SINGLE_SHA $env:BCL_OLD_BOOTSTRAP
