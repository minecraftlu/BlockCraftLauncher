name: BlockCraft v0.9.61 Qianwen official embedded website checks

on:
  push:
    branches:
      - feature/v0961-qwen-web
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blockcraft-v0961-qwen-web-checks
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the CurseForge Worker and request limits
        working-directory: backend/curseforge
        run: node --test *.test.mjs

  public-curseforge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify service discovery and a real public mod download
        run: |
          node --input-type=module <<'JS'
          import { smoke } from './backend/curseforge/smoke.mjs';
          const registry = 'https://raw.githubusercontent.com/minecraftlu/BlockCraftLauncher/curseforge-service-config/service.json';
          const response = await fetch(registry, { redirect: 'error', signal: AbortSignal.timeout(15000) });
          if (!response.ok) throw new Error('Service registry returned HTTP ' + response.status);
          const { serviceUrl } = await response.json();
          if (!serviceUrl) throw new Error('Public CurseForge service is not enabled in the player registry.');
          console.log('Verified mod download:', await smoke(serviceUrl));
          JS

  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
      - name: Static launcher regression checks
        shell: pwsh
        working-directory: wpf-net48
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($check in @('check_project.py', 'check_phase2.py',
              'check_windows_packaging.py', 'check_v0926_features.py',
              'check_onefile.py', 'check_pcl_downloads.py', 'check_download_bindings.py',
              'check_auth_recovery.py', 'check_pcl_unified_ui.py', 'check_pcl_fixed_shell.py',
              'check_skin_search.py', 'check_server_discovery.py', 'check_publisher_metadata.py')) {
            python "tests/$check"
            if ($LASTEXITCODE -ne 0) { throw "Static check failed: $check" }
          }
      - name: Verify Chinese and English launcher command parsing
        shell: pwsh
        working-directory: wpf-net48
        run: ./tests/check_launcher_search_commands.ps1
      - name: Build full WPF and Windows single EXE
        shell: cmd
        working-directory: wpf-net48
        env:
          BlockCraftCurseForgeServiceUrl: ${{ vars.BLOCKCRAFT_CURSEFORGE_SERVICE_URL }}
        run: call build\build-windows.bat
      - name: Offline lifecycle, UI, skin, auth and updater regressions
        shell: pwsh
        working-directory: wpf-net48
        env:
          BLOCKCRAFT_UI_CAPTURE_DIR: ${{ runner.temp }}/blockcraft-v0961-ui
        run: |
          $ErrorActionPreference = 'Stop'
          $wpf = (Resolve-Path 'src/BlockCraftLauncher.Wpf/bin/Release/net48/BlockCraftLauncher.Wpf.exe').Path
          $one = @(Get-ChildItem 'dist' -Filter '*-WPF-OneFile-Windows-x64.exe')
          if ($one.Count -ne 1) { throw 'Expected exactly one standalone EXE' }
          foreach ($binary in @($wpf, $one[0].FullName)) {
            foreach ($argument in @('--download-selftest', '--download-ui-selftest',
                '--skin-selftest', '--auth-selftest', '--smoke-test')) {
              $probe = Start-Process -FilePath $binary -ArgumentList $argument -PassThru -WindowStyle Hidden
              if (-not $probe.WaitForExit(180000)) { $probe.Kill(); throw "Timed out: $argument" }
              $probe.Refresh()
              if ($probe.ExitCode -ne 0) {
                $diagnostic = Join-Path $env:LOCALAPPDATA 'BlockCraftLauncher/wpf-preview-logs/startup-error.log'
                if (Test-Path -LiteralPath $diagnostic) { Get-Content -LiteralPath $diagnostic -Tail 60 }
                $bootstrap = Join-Path $env:LOCALAPPDATA 'BlockCraftLauncher/onefile/bootstrap-error.log'
                if (Test-Path -LiteralPath $bootstrap) { Get-Content -LiteralPath $bootstrap -Encoding utf8 -Tail 12 }
                throw "$binary $argument failed with $($probe.ExitCode)"
              }
              Write-Host "PASS: $binary $argument"
            }
          }
          $updater = (Resolve-Path 'updater/bin/Release/net48/BlockCraftLauncher.Updater.exe').Path
          $probe = Start-Process -FilePath $updater -ArgumentList '--selftest' -PassThru -WindowStyle Hidden
          if (-not $probe.WaitForExit(180000)) { $probe.Kill(); throw 'Updater regression timed out' }
          $probe.Refresh()
          if ($probe.ExitCode -ne 0) { throw "Updater selftest failed: $($probe.ExitCode)" }
      - name: Ensure the disposable Windows runner has the Evergreen WebView2 Runtime
        shell: pwsh
        run: |
          $product = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$product", "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$product"
          function Test-Installed {
            foreach ($reg in $keys) {
              $v = Get-ItemPropertyValue -LiteralPath $reg -Name pv -ErrorAction SilentlyContinue
              if ($v -and ([version]$v) -gt [version]'0.0.0.0') { return $true }
            }
            return $false
          }
          if (!(Test-Installed)) {
            $file = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $file
            $sig = Get-AuthenticodeSignature -LiteralPath $file
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation(?:,|$)') { throw 'Unverified Microsoft installer' }
            $proc = Start-Process -FilePath $file -ArgumentList '/silent','/install' -PassThru -WindowStyle Hidden
            if (!$proc.WaitForExit(180000) -or $proc.ExitCode -ne 0 -or !(Test-Installed)) { throw 'WebView2 Runtime installation failed on runner' }
          }
      - name: Verify official Qianwen in the launcher and preserve native conversations, creative media and commands
        shell: pwsh
        working-directory: wpf-net48
        run: |
          $wpf = (Resolve-Path 'src/BlockCraftLauncher.Wpf/bin/Release/net48/BlockCraftLauncher.Wpf.exe').Path
          $one = @(Get-ChildItem 'dist' -Filter '*-WPF-OneFile-Windows-x64.exe')
          if ($one.Count -ne 1) { throw 'Expected one standalone EXE' }
          foreach ($entry in @(@('wpf', $wpf), @('onefile', $one[0].FullName))) {
            foreach ($check in @(
              @{ flag = '--qwen-web-selftest'; folder = 'web'; report = 'qwen-web-check.txt' },
              @{ flag = '--qwen-search-selftest'; folder = 'qwen'; report = 'qwen-check.txt' },
              @{ flag = '--qwen-download-selftest'; folder = 'qwen-download'; report = 'qwen-download-check.txt' },
              @{ flag = '--qwen-chat-selftest'; folder = 'chat'; report = 'qwen-chat-check.txt' },
              @{ flag = '--qwen-media-selftest'; folder = 'media'; report = 'qwen-media-check.txt' }
            )) {
              $dir = Join-Path $env:RUNNER_TEMP ('blockcraft-v0961-ui/' + $check.folder + '-' + $entry[0])
              $null = New-Item -ItemType Directory -Force -Path $dir
              $env:BLOCKCRAFT_UI_CAPTURE_DIR = $dir
              $process = Start-Process -FilePath $entry[1] -ArgumentList $check.flag -PassThru -WindowStyle Hidden
              try {
                if (!$process.WaitForExit(180000)) { $process.Kill($true); throw "$($check.flag) timed out" }
                $process.Refresh()
                if ($process.ExitCode -ne 0) {
                  $log = Join-Path $env:LOCALAPPDATA 'BlockCraftLauncher/wpf-preview-logs/startup-error.log'
                  if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Encoding utf8 -Tail 20 }
                  $bootstrap = Join-Path $env:LOCALAPPDATA 'BlockCraftLauncher/onefile/bootstrap-error.log'
                  if (Test-Path -LiteralPath $bootstrap) { Get-Content -LiteralPath $bootstrap -Encoding utf8 -Tail 12 }
                  throw "$($check.flag) failed on $($entry[0]) ($($process.ExitCode))"
                }
                $result = Get-Content -ErrorAction Stop -LiteralPath (Join-Path $dir $check.report) -Raw -Encoding utf8
                if ([string]::IsNullOrWhiteSpace($result)) { throw "$($check.flag) produced an empty report" }
                Write-Host $result
              } finally { $process.Dispose() }
            }
          }
      - name: Submit download commands against the public catalogs on Windows
        shell: pwsh
        working-directory: wpf-net48
        run: |
          $app = (Resolve-Path 'src/BlockCraftLauncher.Wpf/bin/Release/net48/BlockCraftLauncher.Wpf.exe').Path
          $dir = Join-Path $env:RUNNER_TEMP 'blockcraft-v0961-ui/live-command'
          $null = New-Item -ItemType Directory -Force -Path $dir
          $env:BLOCKCRAFT_UI_CAPTURE_DIR = $dir
          foreach ($check in @(
            @{ flag = '--qwen-web-live-check'; timeout = 180000; report = 'qwen-web-live-check.txt' },
            @{ flag = '--qwen-download-live-check'; timeout = 300000; report = 'qwen-live-download-check.txt' },
            @{ flag = '--qwen-game-live-check'; timeout = 480000; report = 'qwen-live-game-check.txt' }
          )) {
            $process = Start-Process -FilePath $app -ArgumentList $check.flag -PassThru -WindowStyle Hidden
            try {
              if (!$process.WaitForExit($check.timeout)) { $process.Kill($true); throw "$($check.flag) timed out" }
              $process.Refresh()
              if ($process.ExitCode -ne 0) {
                $log = Join-Path $env:LOCALAPPDATA 'BlockCraftLauncher/wpf-preview-logs/startup-error.log'
                if (Test-Path $log) { Get-Content $log -Encoding utf8 -Tail 32 }
                throw "$($check.flag) failed ($($process.ExitCode))"
              }
              Get-Content -LiteralPath (Join-Path $dir $check.report) -Encoding utf8 -ErrorAction Stop
            } finally { $process.Dispose() }
          }
      - name: Exercise and capture the WPF and OneFile interfaces
        shell: pwsh
        working-directory: wpf-net48
        run: |
          $capture = Join-Path $env:RUNNER_TEMP 'blockcraft-v0961-ui'
          ./tests/check_ui_gallery.ps1 -CaptureDirectory $capture
          Copy-Item -ErrorAction Stop -LiteralPath (Join-Path $capture 'qwen-wpf/qwen-search-result.png') -Destination (Join-Path $capture 'wpf/qwen-search-result.png')
          Copy-Item -ErrorAction Stop -LiteralPath (Join-Path $capture 'qwen-download-wpf/qwen-download-action.png') -Destination (Join-Path $capture 'wpf/qwen-download-action.png')
          Copy-Item -ErrorAction Stop -LiteralPath (Join-Path $capture 'chat-wpf/qwen-chat-result.png') -Destination (Join-Path $capture 'wpf/qwen-chat-result.png')
          Copy-Item -ErrorAction Stop -LiteralPath (Join-Path $capture 'media-wpf/qwen-media.png') -Destination (Join-Path $capture 'wpf/qwen-media.png')
          Copy-Item -ErrorAction Stop -LiteralPath (Join-Path $capture 'web-wpf/qwen-web.png') -Destination (Join-Path $capture 'wpf/qwen-web.png')
          $anonymousWeb = Join-Path $capture 'live-command/qwen-web-live.png'
          if (Test-Path -LiteralPath $anonymousWeb) {
            Copy-Item -LiteralPath $anonymousWeb -Destination (Join-Path $capture 'wpf/qwen-web-live.png')
          }
          ./tests/export_ui_preview.ps1 -QwenWebPreview -CaptureDirectory (Join-Path $capture 'wpf') -OutputFile (Join-Path (Resolve-Path 'dist') 'BlockCraftLauncher-v0.9.61-qwen-web.jpg')
      - name: Test desktop OneFile update with real Windows executables
        shell: pwsh
        working-directory: wpf-net48
        run: ./tests/check_desktop_update.ps1
      - name: Test automatic desktop download without installation
        shell: pwsh
        working-directory: wpf-net48
        run: ./tests/check_desktop_download.ps1
      - name: Download the official standalone CurseForge installer and verify its Windows publisher
        shell: pwsh
        working-directory: wpf-net48
        run: ./tests/check_curseforge_installer.ps1
      - name: Upload verified preview builds
        uses: actions/upload-artifact@v4
        with:
          name: BlockCraftLauncher-v0.9.61-RC1-Windows-x64
          path: |
            wpf-net48/dist/*-WPF-OneFile-Windows-x64.exe
            wpf-net48/dist/*-WPF-OneFile-Windows-x64.exe.sha256
            wpf-net48/dist/*-WPF-net48-Alpha-Windows-x64.zip
            wpf-net48/dist/BlockCraftLauncher-v0.9.61-qwen-web.jpg
          retention-days: 14
          if-no-files-found: error
      - name: Upload UI evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlockCraftLauncher-v0961-diagnostics
          path: ${{ runner.temp }}/blockcraft-v0961-ui/
          retention-days: 7
          if-no-files-found: ignore

  visual-review:
    needs: [windows, backend]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BlockCraftLauncher-v0.9.61-RC1-Windows-x64
          path: gallery
      - name: Show the release preview from the offline UI fixtures
        shell: bash
        run: |
          echo 'RELEASE_PREVIEW_START'
          base64 -w 120 gallery/BlockCraftLauncher-v0.9.61-qwen-web.jpg
          echo 'RELEASE_PREVIEW_END'
