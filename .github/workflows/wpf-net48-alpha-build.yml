name: WPF net48 Alpha (Windows build)
on:
  workflow_dispatch:
  push:
    paths:
      - 'wpf-net48/src/BlockCraftLauncher.Wpf/**'
      - 'wpf-net48/BlockCraftLauncher-WPF.sln'
      - 'wpf-net48/build/**'
      - 'wpf-net48/tests/**'
      - '.github/workflows/wpf-net48-alpha-build.yml'

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Static migration checks (not a substitute for WPF build)
        shell: pwsh
        working-directory: wpf-net48
        run: |
          python tests/check_project.py
          python tests/check_phase2.py
          python tests/check_windows_packaging.py
          python tests/check_v0926_features.py
          python tests/check_onefile.py
          python tests/check_pcl_downloads.py
      - name: Restore, compile and package with Visual Studio MSBuild
        shell: cmd
        working-directory: wpf-net48
        run: call build\build-windows.bat
      - name: Smoke test WPF startup and dependency resolution
        shell: pwsh
        working-directory: wpf-net48
        timeout-minutes: 2
        run: |
          $exe = (Resolve-Path 'src/BlockCraftLauncher.Wpf/bin/Release/net48/BlockCraftLauncher.Wpf.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(35000)) {
            $process.Kill()
            throw 'WPF startup smoke test timed out'
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA 'BlockCraftLauncher/wpf-preview-logs/startup-error.log'
            if (Test-Path $log) { Get-Content $log -Tail 35 }
            throw "WPF startup smoke test failed: exit code $($process.ExitCode)"
          }
          Write-Host 'PASS: WPF MainWindow initialized and CmlLib dependencies loaded'
      - name: Offline downloader self-tests (no game downloads)
        shell: pwsh
        working-directory: wpf-net48
        timeout-minutes: 2
        run: |
          $exe = (Resolve-Path 'src/BlockCraftLauncher.Wpf/bin/Release/net48/BlockCraftLauncher.Wpf.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--download-selftest' -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw 'Download selftest timed out'
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA 'BlockCraftLauncher/wpf-preview-logs/startup-error.log'
            if (Test-Path $log) { Get-Content $log -Tail 35 }
            throw "Offline downloader selftest failed: $($process.ExitCode)"
          }
          Write-Host 'PASS: Mojang/BMCLAPI routes and Minecraft release/snapshot categorization'
      - name: Smoke test download management page and read-only progress binding
        shell: pwsh
        working-directory: wpf-net48
        timeout-minutes: 2
        run: |
          $exe = (Resolve-Path 'src/BlockCraftLauncher.Wpf/bin/Release/net48/BlockCraftLauncher.Wpf.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--download-ui-selftest' -PassThru
          if (-not $process.WaitForExit(35000)) {
            $process.Kill()
            throw 'WPF download page smoke test timed out'
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA 'BlockCraftLauncher/wpf-preview-logs/startup-error.log'
            if (Test-Path $log) { Get-Content $log -Tail 35 }
            throw "WPF download page binding test failed: $($process.ExitCode)"
          }
          Write-Host 'PASS: WPF download page binds read-only Percent using OneWay'
      - name: Smoke test download page from single EXE
        shell: pwsh
        working-directory: wpf-net48
        timeout-minutes: 2
        run: |
          $exe = (Resolve-Path 'dist/BlockCraftLauncher-v0.9.27-WPF-OneFile-Windows-x64.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--download-ui-selftest' -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Single EXE download page binding test timed out'
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA 'BlockCraftLauncher/onefile/bootstrap-error.log'
            if (Test-Path $log) { Get-Content $log -Tail 35 }
            throw "Single EXE download page binding test failed: $($process.ExitCode)"
          }
          Write-Host 'PASS: single EXE opens download management page without readonly binding error'
      - name: Smoke test single EXE payload extraction and startup
        shell: pwsh
        working-directory: wpf-net48
        timeout-minutes: 2
        run: |
          $exe = (Resolve-Path 'dist/BlockCraftLauncher-v0.9.27-WPF-OneFile-Windows-x64.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Single-file startup smoke test timed out'
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA 'BlockCraftLauncher/onefile/bootstrap-error.log'
            if (Test-Path $log) { Get-Content $log -Tail 30 }
            throw "Single-file startup smoke test failed: $($process.ExitCode)"
          }
          Write-Host 'PASS: single EXE extracted, verified and started WPF MainWindow'
      - name: Check release artifact
        shell: pwsh
        working-directory: wpf-net48
        run: |
          if (!(Test-Path 'src/BlockCraftLauncher.Wpf/bin/Release/net48/BlockCraftLauncher.Wpf.exe')) { throw 'EXE not produced' }
          if (!(Test-Path 'dist/BlockCraftLauncher-v0.9.27-WPF-net48-Alpha-Windows-x64.zip')) { throw 'ZIP not produced' }
          if (!(Test-Path 'dist/BlockCraftLauncher-v0.9.27-WPF-OneFile-Windows-x64.exe')) { throw 'One-file EXE not produced' }
      - uses: actions/upload-artifact@v4
        with:
          name: BlockCraftLauncher-v0.9.27-WPF-net48-Windows-Alpha
          path: |
            wpf-net48/dist/BlockCraftLauncher-v0.9.27-WPF-net48-Alpha-Windows-x64.zip
            wpf-net48/dist/BlockCraftLauncher-v0.9.27-WPF-OneFile-Windows-x64.exe
            wpf-net48/dist/BlockCraftLauncher-v0.9.27-WPF-OneFile-Windows-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14
