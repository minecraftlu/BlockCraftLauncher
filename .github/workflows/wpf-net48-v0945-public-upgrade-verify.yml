name: Verify published v0.9.45 Stable upgrade without republishing

on:
  push:
    branches:
      - verify/v0945-stable-public-upgrade

concurrency:
  group: blockcraft-v0945-stable-public-upgrade
  cancel-in-progress: false

jobs:
  verify-public-stable:
    if: github.repository == 'minecraftlu/BlockCraftLauncher' && github.ref == 'refs/heads/verify/v0945-stable-public-upgrade'
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      RELEASE_TAG: v0.9.45
      RELEASE_ZIP: BlockCraftLauncher-v0.9.45-WPF-net48-Windows-x64.zip
      RELEASE_EXE: BlockCraftLauncher-v0.9.45-WPF-OneFile-Windows-x64.exe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assert published Stable source is unchanged and release is public
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $original = '28051fe501f9e838068dd4b769b762ae890bc137'
          & git merge-base --is-ancestor $original HEAD
          if ($LASTEXITCODE -ne 0) {
            throw 'This verifier must descend only from published v0.9.45 Stable'
          }
          $changes = @(& git diff --name-only $original HEAD)
          $expected = @('.github/workflows/wpf-net48-v0945-public-upgrade-verify.yml')
          if ($changes.Count -ne $expected.Count -or @($changes | Where-Object { $_ -notin $expected }).Count -gt 0) {
            throw 'Verifier changed release source code or unexpected files'
          }
          & git fetch --no-tags --depth=1 origin refs/tags/v0.9.45
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve Stable release tag' }
          $tagCommit = (& git rev-parse 'FETCH_HEAD^{commit}').Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $original) {
            throw 'Public Stable release tag does not point to the tested original source'
          }
          $version = Get-Content -LiteralPath 'wpf-net48/src/BlockCraftLauncher.Wpf/Services/LauncherAutoUpdateService.cs' -Raw
          if ($version -cnotmatch 'internal const string CurrentTag = "v0\.9\.45";') {
            throw 'Stable binary version is mismatched'
          }
          Write-Host 'PASS: source code is identical to published Stable commit, only test harness differs'

      - name: Download and hash-verify exact published Stable ZIP and EXE
        working-directory: wpf-net48
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force 'dist' | Out-Null
          $files = @{
            $env:RELEASE_ZIP = '07fcb3f72ee2d9bca907bb4b9fc4e5b372d163c8f92a5996e0a8351f49ec1ba0'
            $env:RELEASE_EXE = '6cc4ef2e0f3284985bf2277160cda50dd577386afab22181c521c28db317f2f4'
          }
          foreach ($name in $files.Keys) {
            $uri = "https://github.com/minecraftlu/BlockCraftLauncher/releases/download/v0.9.45/$name"
            Invoke-WebRequest -Uri $uri -OutFile (Join-Path 'dist' $name) -TimeoutSec 55
            $got = (Get-FileHash -LiteralPath (Join-Path 'dist' $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($got -ne $files[$name]) { throw "Published stable hash mismatch: $name" }
            Write-Host "PASS: published $name SHA-256 $got"
          }
          $sum = foreach ($name in @($env:RELEASE_EXE,$env:RELEASE_ZIP)) {
            $got = (Get-FileHash -LiteralPath (Join-Path 'dist' $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$got  $name"
          }
          $sum | Set-Content -LiteralPath 'dist/RELEASE-SHA256SUMS.txt' -Encoding ASCII

      - name: Preflight verify v0.9.44 can parse and stage published Stable
        shell: pwsh
        working-directory: wpf-net48
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tests/check_v0945_stable_promotion.ps1 -Phase Preflight
          if ($LASTEXITCODE -ne 0) { throw 'Public Stable preflight failed' }

      - name: Live upgrade old OneFile and ZIP using public Stable 0.9.44
        shell: pwsh
        working-directory: wpf-net48
        timeout-minutes: 16
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tests/check_v0945_stable_promotion.ps1 -Phase Live
          if ($LASTEXITCODE -ne 0) { throw 'Public Stable OneFile and ZIP in-place upgrades failed' }
          Write-Host 'PASS: BOTH published Stable upgrade paths completed with original targets, relaunch and cleanup'
