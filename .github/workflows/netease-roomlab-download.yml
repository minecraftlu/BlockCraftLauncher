name: Publish NetEase Room Lab Stage 11.1 passive dual-channel observations

on:
  push:
    branches:
      - experiment/netease-room-discovery
    paths:
      - '.github/workflows/netease-roomlab-download.yml'
      - 'experiments/netease-room-discovery/NeteaseRoomLab/**'
      - 'experiments/netease-room-discovery/NeteaseRoomLab.Tests/**'
      - 'experiments/netease-room-discovery/GuestTransportLab/**'
  workflow_dispatch:

permissions:
  contents: write

# Serialise preview publications, and stop a stale SHA from overwriting a
# newer single-EXE build after a sequence of experimental source commits.
concurrency:
  group: blockcraft-stage11-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-preview:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4

      - name: Install Go for embedded lobby probe
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Build and test genuine RakNet guest probe (no network credentials)
        shell: pwsh
        working-directory: experiments/netease-room-discovery/GuestTransportLab
        run: |
          go mod tidy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Negative-control: the exact pinned unpatched fork must emit bad CRC32.
          go test -count=1 -run "^TestForkedSCTPInitHasStandardsCompliantCRC32cWireBytes$" ./internal/joinprobe
          if ($LASTEXITCODE -eq 0) { throw "The unpatched fork unexpectedly produced RFC4960-compliant INIT." }

          & "./tools/create-sctp-crc32c-overlay.ps1" -OutPath ".blockcraft/nethernet-fork"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path ".blockcraft/nethernet-fork/go.mod")) {
            throw "Patched local fork directory not found in current Go module."
          }
          go test -count=1 -timeout=90s ./internal/joinprobe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force "dist" | Out-Null
          go build -trimpath -ldflags="-s -w" -o "dist/BlockCraft.JoinProbe.exe" ./cmd/joinprobe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist/BlockCraft.JoinProbe.exe")) {
            throw "Embedded RakNet probe executable not found."
          }

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build offline tests
        shell: pwsh
        run: |
          msbuild "experiments/netease-room-discovery/NeteaseRoomLab.Tests/NeteaseRoomLab.Tests.csproj" /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run offline tests
        shell: pwsh
        run: |
          & "experiments/netease-room-discovery/NeteaseRoomLab.Tests/bin/Release/BlockCraft.NeteaseRoomLab.Tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Cross-language Stage11.1 IPC integration on compiled EXEs (offline)
        shell: pwsh
        run: |
          & "experiments/netease-room-discovery/NeteaseRoomLab.Tests/bin/Release/BlockCraft.NeteaseRoomLab.Tests.exe" --probe-ipc-exe "experiments/netease-room-discovery/GuestTransportLab/dist/BlockCraft.JoinProbe.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_STEP_SUMMARY "Actual compiled Go EXE -> Windows .NET Framework UTF-8 machine-frame parser passed offline."

      - name: Build WPF standalone EXE
        shell: pwsh
        run: |
          msbuild "experiments/netease-room-discovery/NeteaseRoomLab/NeteaseRoomLab.csproj" /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify single WPF EXE embeds RakNet probe
        shell: powershell
        run: |
          $path = (Resolve-Path "experiments/netease-room-discovery/NeteaseRoomLab/bin/Release/BlockCraft.NeteaseRoomLab.exe").Path
          $assembly = [System.Reflection.Assembly]::LoadFile($path)
          $names = $assembly.GetManifestResourceNames()
          if (-not ($names -contains "BlockCraft.JoinProbe.exe")) {
            throw "WPF single EXE does not include embedded real join probe."
          }
          Add-Content $env:GITHUB_STEP_SUMMARY "Verified embedded resource BlockCraft.JoinProbe.exe in standalone WPF EXE."

      - name: Package stable file names and SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "stage11-1-release" | Out-Null
          Copy-Item "experiments/netease-room-discovery/NeteaseRoomLab/bin/Release/BlockCraft.NeteaseRoomLab.exe" "stage11-1-release/BlockCraftRoomStage11_1.exe"
          Compress-Archive -LiteralPath "stage11-1-release/BlockCraftRoomStage11_1.exe" -DestinationPath "stage11-1-release/BlockCraftRoomStage11_1.zip" -Force
          $files = @("BlockCraftRoomStage11_1.exe", "BlockCraftRoomStage11_1.zip")
          $lines = foreach ($f in $files) {
            $sum = (Get-FileHash "stage11-1-release/$f" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$sum  $f"
          }
          $lines | Set-Content "stage11-1-release/SHA256SUMS.txt" -Encoding ascii
          Add-Content $env:GITHUB_STEP_SUMMARY "Release output files: BlockCraftRoomStage11_1.exe and BlockCraftRoomStage11_1.zip"

      - name: Publish experimental GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "netease-roomlab-stage11-1-preview"
          $notes = "Experimental C# WPF NetEase room lab. Stage 9 embeds a Windows Go RakNet lobby guest-side probe inside the single C# WPF .NET Framework 4.8 EXE. Only on explicit user confirmation and permission from the room host, it attempts one real lobby login and sends an EnterRoom request only after server accepts login. It reports genuine TanLoginResponse / TanEnterRoomResponse statuses and optional host NetherNet readiness. Stage9.1 fixes JOIN_PROBE_OUTPUT_INVALID: UTF-8 Windows child encoding, versioned ASCII-only one-line Go-to-WPF IPC frame, strict state verification and real compiled EXE cross-language offline CI test. Stage10 adds explicitly opt-in real NetherNet signaling WebSocket and Pion ICE/DTLS/SCTP session negotiation after real host-ready notification. Stage10.1 diagnoses host answer and ICE candidate timeouts, ICE connect, DTLS, SCTP and data channel failures from fixed stage labels only; no private candidate IPs, SDP, ICE passwords, tokens or raw errors are recorded. Stage10.2 separates typed SCTP INIT ACK retransmission exhaustion, COOKIE ACK retransmission exhaustion, premature association close, and SCTP timeouts; no unverified protocol parameters modified. Stage10.3 corrects previous Pion SCTP error-type mismatch: the NetEase fork uses core/sctp, not github.com/pion/sctp. It caps forked SCTP retry backoff at 3 seconds (8 retry limit unchanged), extends bounded signaling/ICE/DTLS/SCTP test to 70s with 105s overall, and labels outer probe expiration separately from actual SCTP handshake failure. Stage10.4 repairs the pinned NetherNet fork's SCTP CRC32 error: it mistakenly used IEEE polynomial and big-endian checksum whereas RFC4960 requires CRC32c Castagnoli and little-endian wire representation. The Windows build applies a locked build-only Go source overlay and proves the actual SCTP INIT bytes fail the test unpatched and pass patched; does not alter account authorization or attempt to bypass protections. Stage10.4 fixed WebRTC SCTP CRC32c was confirmed by the user's Windows phone-room test as WEBRTC_TRANSPORT_CONNECTED_GAME_NOT_JOINED. Stage10.5 preserves this known-good transport, adds a passive 8s stability observation window (not Minecraft world join), stdin-EOF cooperative cancellation, WPF explicit Stop button and on-window-close cancellation, bounded 4s shutdown then kill fallback, fixed status invariants and offline Go-to-C# cancel IPC tests. No credentials or ICE data logged. User confirmed Stage10.5 WEBRTC_TRANSPORT_STABLE_8S_GAME_NOT_JOINED on Windows. Stage11.1 adds optional passive 30s/60s post-WebRTC dual reliable/unreliable DataChannel OPEN checks and bounded received-message count and byte-length metrics, using an isolated local fork read-only observer; never logs/transmits/decodes gameplay content or declares Minecraft world joined. Only Stage10.4/10.5 transport success was tested on a real phone; new Stage11.1 observation is CI offline-tested and requires user verification. It never sends Minecraft game packets and never claims world join. No Minecraft client, no game world, no login bypass. No credentials or tokens printed or uploaded. UNSIGNED. Experimental third-party protocol with account and platform terms risk."
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "stage11-1-release/BlockCraftRoomStage11_1.exe" "stage11-1-release/BlockCraftRoomStage11_1.zip" "stage11-1-release/SHA256SUMS.txt" --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag "stage11-1-release/BlockCraftRoomStage11_1.exe" "stage11-1-release/BlockCraftRoomStage11_1.zip" "stage11-1-release/SHA256SUMS.txt" --target $env:GITHUB_SHA --title "BlockCraft 网易房间实验室 Stage 11.1（数据通道只读诊断与 30/60 秒观察）" --notes $notes --prerelease --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub preview publishing failed." }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json url,assets

      - name: Preserve Actions artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: BlockCraft-RoomLab-Stage11_1-download
          path: stage11-1-release/
          if-no-files-found: error
          retention-days: 30
