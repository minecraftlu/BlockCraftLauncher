name: Publish NetEase Room Lab Stage 10.2 SCTP handshake diagnostics

on:
  push:
    branches:
      - experiment/netease-room-discovery
    paths:
      - '.github/workflows/netease-roomlab-download.yml'
      - 'experiments/netease-room-discovery/NeteaseRoomLab/**'
      - 'experiments/netease-room-discovery/NeteaseRoomLab.Tests/**'
      - 'experiments/netease-room-discovery/GuestTransportLab/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-preview:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4

      - name: Install Go for embedded lobby probe
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Build and test genuine RakNet guest probe (no network credentials)
        shell: pwsh
        run: |
          Push-Location "experiments/netease-room-discovery/GuestTransportLab"
          try {
            go mod tidy
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            go test -count=1 -timeout=90s ./internal/joinprobe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            New-Item -ItemType Directory -Force "dist" | Out-Null
            go build -trimpath -ldflags="-s -w" -o "dist/BlockCraft.JoinProbe.exe" ./cmd/joinprobe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not (Test-Path "dist/BlockCraft.JoinProbe.exe")) {
              throw "Embedded RakNet probe executable not found."
            }
          } finally {
            Pop-Location
          }

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build offline tests
        shell: pwsh
        run: |
          msbuild "experiments/netease-room-discovery/NeteaseRoomLab.Tests/NeteaseRoomLab.Tests.csproj" /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run offline tests
        shell: pwsh
        run: |
          & "experiments/netease-room-discovery/NeteaseRoomLab.Tests/bin/Release/BlockCraft.NeteaseRoomLab.Tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Cross-language Stage10.2 IPC integration on compiled EXEs (offline)
        shell: pwsh
        run: |
          & "experiments/netease-room-discovery/NeteaseRoomLab.Tests/bin/Release/BlockCraft.NeteaseRoomLab.Tests.exe" --probe-ipc-exe "experiments/netease-room-discovery/GuestTransportLab/dist/BlockCraft.JoinProbe.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_STEP_SUMMARY "Actual compiled Go EXE -> Windows .NET Framework UTF-8 machine-frame parser passed offline."

      - name: Build WPF standalone EXE
        shell: pwsh
        run: |
          msbuild "experiments/netease-room-discovery/NeteaseRoomLab/NeteaseRoomLab.csproj" /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify single WPF EXE embeds RakNet probe
        shell: powershell
        run: |
          $path = (Resolve-Path "experiments/netease-room-discovery/NeteaseRoomLab/bin/Release/BlockCraft.NeteaseRoomLab.exe").Path
          $assembly = [System.Reflection.Assembly]::LoadFile($path)
          $names = $assembly.GetManifestResourceNames()
          if (-not ($names -contains "BlockCraft.JoinProbe.exe")) {
            throw "WPF single EXE does not include embedded real join probe."
          }
          Add-Content $env:GITHUB_STEP_SUMMARY "Verified embedded resource BlockCraft.JoinProbe.exe in standalone WPF EXE."

      - name: Package stable file names and SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "stage10-2-release" | Out-Null
          Copy-Item "experiments/netease-room-discovery/NeteaseRoomLab/bin/Release/BlockCraft.NeteaseRoomLab.exe" "stage10-2-release/BlockCraftRoomStage10_2.exe"
          Compress-Archive -LiteralPath "stage10-2-release/BlockCraftRoomStage10_2.exe" -DestinationPath "stage10-2-release/BlockCraftRoomStage10_2.zip" -Force
          $files = @("BlockCraftRoomStage10_2.exe", "BlockCraftRoomStage10_2.zip")
          $lines = foreach ($f in $files) {
            $sum = (Get-FileHash "stage10-2-release/$f" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$sum  $f"
          }
          $lines | Set-Content "stage10-2-release/SHA256SUMS.txt" -Encoding ascii
          Add-Content $env:GITHUB_STEP_SUMMARY "Release output files: BlockCraftRoomStage10_2.exe and BlockCraftRoomStage10_2.zip"

      - name: Publish experimental GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "netease-roomlab-stage10-2-preview"
          $notes = "Experimental C# WPF NetEase room lab. Stage 9 embeds a Windows Go RakNet lobby guest-side probe inside the single C# WPF .NET Framework 4.8 EXE. Only on explicit user confirmation and permission from the room host, it attempts one real lobby login and sends an EnterRoom request only after server accepts login. It reports genuine TanLoginResponse / TanEnterRoomResponse statuses and optional host NetherNet readiness. Stage9.1 fixes JOIN_PROBE_OUTPUT_INVALID: UTF-8 Windows child encoding, versioned ASCII-only one-line Go-to-WPF IPC frame, strict state verification and real compiled EXE cross-language offline CI test. Stage10 adds explicitly opt-in real NetherNet signaling WebSocket and Pion ICE/DTLS/SCTP session negotiation after real host-ready notification. Stage10.1 diagnoses host answer and ICE candidate timeouts, ICE connect, DTLS, SCTP and data channel failures from fixed stage labels only; no private candidate IPs, SDP, ICE passwords, tokens or raw errors are recorded. Stage10.2 separates typed SCTP INIT ACK retransmission exhaustion, COOKIE ACK retransmission exhaustion, premature association close, and SCTP timeouts; no unverified protocol parameters modified. It never sends Minecraft game packets and never claims world join. No Minecraft client, no game world, no login bypass. No credentials or tokens printed or uploaded. UNSIGNED. Experimental third-party protocol with account and platform terms risk."
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "stage10-2-release/BlockCraftRoomStage10_2.exe" "stage10-2-release/BlockCraftRoomStage10_2.zip" "stage10-2-release/SHA256SUMS.txt" --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag "stage10-2-release/BlockCraftRoomStage10_2.exe" "stage10-2-release/BlockCraftRoomStage10_2.zip" "stage10-2-release/SHA256SUMS.txt" --target $env:GITHUB_SHA --title "BlockCraft 网易房间实验室 Stage 10.2（SCTP INIT/COOKIE 子阶段诊断版）" --notes $notes --prerelease --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub preview publishing failed." }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json url,assets

      - name: Preserve Actions artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: BlockCraft-RoomLab-Stage10_2-download
          path: stage10-2-release/
          if-no-files-found: error
          retention-days: 30
