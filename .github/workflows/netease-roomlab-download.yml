name: Publish NetEase Room Lab Stage 7 admission schema

on:
  push:
    branches:
      - experiment/netease-room-discovery
    paths:
      - '.github/workflows/netease-roomlab-download.yml'
      - 'experiments/netease-room-discovery/NeteaseRoomLab/**'
      - 'experiments/netease-room-discovery/NeteaseRoomLab.Tests/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-preview:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build offline tests
        shell: pwsh
        run: |
          msbuild "experiments/netease-room-discovery/NeteaseRoomLab.Tests/NeteaseRoomLab.Tests.csproj" /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run offline tests
        shell: pwsh
        run: |
          & "experiments/netease-room-discovery/NeteaseRoomLab.Tests/bin/Release/BlockCraft.NeteaseRoomLab.Tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build WPF standalone EXE
        shell: pwsh
        run: |
          msbuild "experiments/netease-room-discovery/NeteaseRoomLab/NeteaseRoomLab.csproj" /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package stable file names and SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "stage7-release" | Out-Null
          Copy-Item "experiments/netease-room-discovery/NeteaseRoomLab/bin/Release/BlockCraft.NeteaseRoomLab.exe" "stage7-release/BlockCraftRoomStage7.exe"
          Compress-Archive -LiteralPath "stage7-release/BlockCraftRoomStage7.exe" -DestinationPath "stage7-release/BlockCraftRoomStage7.zip" -Force
          $files = @("BlockCraftRoomStage7.exe", "BlockCraftRoomStage7.zip")
          $lines = foreach ($f in $files) {
            $sum = (Get-FileHash "stage7-release/$f" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$sum  $f"
          }
          $lines | Set-Content "stage7-release/SHA256SUMS.txt" -Encoding ascii
          Add-Content $env:GITHUB_STEP_SUMMARY "Release output files: BlockCraftRoomStage7.exe and BlockCraftRoomStage7.zip"

      - name: Publish experimental GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "netease-roomlab-stage7-preview"
          $notes = "Experimental C# WPF NetEase room lab. Stage 7 adds offline TanLobby admission-envelope schema validation and a reserved authorized provider interface; synthetic data only. No live room admission or game session. No credential upload. No room join is implemented; do not publish credentials. UNSIGNED. Not a Minecraft client; does NOT join any NetEase room. Only run trusted programs and never share passwords or tokens."
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "stage7-release/BlockCraftRoomStage7.exe" "stage7-release/BlockCraftRoomStage7.zip" "stage7-release/SHA256SUMS.txt" --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag "stage7-release/BlockCraftRoomStage7.exe" "stage7-release/BlockCraftRoomStage7.zip" "stage7-release/SHA256SUMS.txt" --target $env:GITHUB_SHA --title "BlockCraft 网易房间实验室 Stage 7（本地联机准入结构实验）" --notes $notes --prerelease --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub preview publishing failed." }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json url,assets

      - name: Preserve Actions artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: BlockCraft-RoomLab-Stage7-download
          path: stage7-release/
          if-no-files-found: error
          retention-days: 30
