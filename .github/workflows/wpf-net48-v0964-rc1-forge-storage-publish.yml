name: Publish BlockCraft Launcher v0.9.64 RC1 Forge and custom storage preview

on:
  push:
    branches: [release/v0964-wpf-rc1-forge-storage]

concurrency:
  group: blockcraft-v0964-rc1-forge-storage-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'minecraftlu/BlockCraftLauncher' && github.ref == 'refs/heads/release/v0964-wpf-rc1-forge-storage'
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    defaults:
      run:
        shell: pwsh
        working-directory: wpf-net48
    env:
      TAG: v0.9.64-wpf-rc.1
      BUILD_SHA: d0b466a3e9550735773b12e10b24de6a40f84e69
      BUILD_RUN: '45595907950'
      EXE_NAME: BlockCraftLauncher-v0.9.64-WPF-OneFile-Windows-x64.exe
      ZIP_NAME: BlockCraftLauncher-v0.9.64-WPF-net48-Alpha-Windows-x64.zip
      PREVIOUS: v0.9.63-wpf-rc.1
      PREVIOUS_ZIP_SHA256: a403c88a9219d453630dc1b5659a7952ceee13aa970f05c081586e296ba0f53a
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Retrieve the exact tested build and verify its two recorded SHA-256 hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.conclusion -cne 'success' -or $run.head_sha -cne $env:BUILD_SHA -or
              $run.path -cne '.github/workflows/wpf-forge-storage.yml') { throw 'Unexpected source build' }
          $archive = Join-Path $env:RUNNER_TEMP 'blockcraft-tested-artifact.zip'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/15012373188/zip" -Headers $headers -OutFile $archive
          $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($archiveHash -ine '810d5bbc6bea9c33a3cd0f434bebc77a08f5b5f37c6a184f0406a7f56753b9b2') {
            throw 'Archive digest differs from the successful Windows build'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath dist
          $expected = @{}
          $expected[$env:EXE_NAME] = "7fb9be1d570e29f8c753e56ab5f5bf6020d4907607cd43147f7849a439f7a4b1"
          $expected[$env:ZIP_NAME] = "559461c4dd02f290c8c1657fe71be1c772e02a7bd49adcb411b40e9328a60f77"
          $manifest = @(foreach ($name in @($env:EXE_NAME, $env:ZIP_NAME)) {
            $hash = (Get-FileHash -LiteralPath "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -cne $expected[$name]) { throw "Checksum differs from the tested Windows build: $name" }
            "$hash  $name"
          })
          if ((Get-Content -LiteralPath "dist/$env:EXE_NAME.sha256" -Raw).Trim() -cne $manifest[0]) { throw "Single-file checksum sidecar mismatch" }
          $recorded = Get-Content -LiteralPath dist/RELEASE-SHA256SUMS.txt
          if (($recorded -join [Environment]::NewLine) -cne ($manifest -join [Environment]::NewLine)) { throw "Distribution checksums differ from the Windows artifact" }

      - name: Check both distributions with the previous public preview updater
        run: ./tests/check_v0951_rc1_preview_offer.ps1 -Phase Preflight -Tag $env:TAG -Previous $env:PREVIOUS -PreviousZipSha256 $env:PREVIOUS_ZIP_SHA256

      - name: Attest the exact binaries being promoted
        uses: actions/attest@v4
        with:
          subject-path: |
            wpf-net48/dist/BlockCraftLauncher-v0.9.64-WPF-OneFile-Windows-x64.exe
            wpf-net48/dist/BlockCraftLauncher-v0.9.64-WPF-net48-Alpha-Windows-x64.zip

      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign and verify the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $identity = "https://github.com/$env:GITHUB_WORKFLOW_REF"
          $signer = "github.com/$env:GITHUB_REPOSITORY/.github/workflows/wpf-net48-v0964-rc1-forge-storage-publish.yml"
          foreach ($name in @($env:EXE_NAME, $env:ZIP_NAME)) {
            $file = "dist/$name"
            cosign sign-blob --yes --bundle "$file.sigstore.json" $file
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $name" }
            cosign verify-blob $file --bundle "$file.sigstore.json" --certificate-identity $identity --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $name" }
            gh attestation verify $file --repo $env:GITHUB_REPOSITORY --source-ref $env:GITHUB_REF --signer-workflow $signer
            if ($LASTEXITCODE -ne 0) { throw "Release attestation verification failed for $name" }
          }

      - name: Publish the packages, checksums and signatures as a prerelease at the tested source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tagRef = git ls-remote --tags origin "refs/tags/$env:TAG"
          if ($LASTEXITCODE -ne 0 -or $tagRef) { throw 'Tag already exists or could not be checked' }
          $files = @("dist/$env:EXE_NAME", "dist/$env:EXE_NAME.sha256",
            "dist/$env:ZIP_NAME", 'dist/RELEASE-SHA256SUMS.txt',
            "dist/$env:EXE_NAME.sigstore.json", "dist/$env:ZIP_NAME.sigstore.json")
          gh release create $env:TAG @files --repo $env:GITHUB_REPOSITORY --target $env:BUILD_SHA --title 'BlockCraft Launcher v0.9.64 RC1（Forge 构建选择与自定义下载目录）' --notes-file './docs/release-v0.9.64-rc1.md' --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Prerelease creation failed' }
          $published = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $published.isDraft -or !$published.isPrerelease -or $published.tagName -cne $env:TAG) {
            throw 'Published release does not match the requested preview'
          }
          foreach ($file in $files) {
            if ($published.assets.name -cnotcontains (Split-Path $file -Leaf)) { throw "Missing release asset $file" }
          }

      - name: Test the public downloads and the live preview feed with v0.9.63
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tests/check_v0951_rc1_preview_offer.ps1 -Phase Live -Tag $env:TAG -Previous $env:PREVIOUS -PreviousZipSha256 $env:PREVIOUS_ZIP_SHA256
