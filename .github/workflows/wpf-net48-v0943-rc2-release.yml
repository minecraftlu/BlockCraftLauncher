name: Publish BlockCraft Launcher v0.9.43 RC2

on:
  push:
    branches:
      - release/v0943-rc2-ui-skins-update

concurrency:
  group: blockcraft-v0943-rc2-publish
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'minecraftlu/BlockCraftLauncher' && github.ref == 'refs/heads/release/v0943-rc2-ui-skins-update'
    runs-on: windows-2022
    permissions:
      actions: read
      attestations: read
      contents: write
    env:
      RELEASE_TAG: v0.9.43-wpf-rc.2
      RELEASE_EXE: BlockCraftLauncher-v0.9.43-WPF-OneFile-Windows-x64.exe
      RELEASE_ZIP: BlockCraftLauncher-v0.9.43-WPF-net48-Alpha-Windows-x64.zip
      SOURCE_SHA: 095f9147e89b6961db735f5cf9f2f32979595a54
      BUILD_RUN: '43047695233'
      BUILD_REF: refs/heads/feature/v0943-rc2-ui-skins-update
      BUILD_ARTIFACT: '13868151817'
      BUILD_ARTIFACT_DIGEST: sha256:3010a354484dfab1261f151212d5b5e990e485372c3cee7418a2d20a20c1ca89
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check the tested source and Windows artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $run = & gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success' -or $run.head_sha -ne $env:SOURCE_SHA) {
            throw 'The pinned Windows build did not pass for the expected source'
          }
          $artifact = & gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:BUILD_ARTIFACT" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $artifact.expired -or
              $artifact.workflow_run.id -ne [long]$env:BUILD_RUN -or
              $artifact.workflow_run.head_sha -ne $env:SOURCE_SHA -or $artifact.digest -ne $env:BUILD_ARTIFACT_DIGEST) {
            throw 'The artifact does not match the tested Windows build'
          }
          $tag = & git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0 -or $tag) { throw 'RC2 tag already exists or could not be checked' }

      - uses: actions/download-artifact@v4
        with:
          name: BlockCraftLauncher-v0.9.43-RC2-Windows
          run-id: 43047695233
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: wpf-net48/dist

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Verify SHA-256, Sigstore signatures and build provenance
        shell: pwsh
        working-directory: wpf-net48
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $workflow = "$env:GITHUB_REPOSITORY/.github/workflows/wpf-net48-alpha-build.yml"
          $identity = "https://github.com/$workflow@$env:BUILD_REF"
          $manifest = @(Get-Content -LiteralPath 'dist/RELEASE-SHA256SUMS.txt')
          if ($manifest.Count -ne 2) { throw 'Expected two package hashes' }
          foreach ($name in @($env:RELEASE_EXE, $env:RELEASE_ZIP)) {
            $path = Join-Path 'dist' $name
            $sha = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($manifest -cnotcontains "$sha  $name") { throw "Package hash mismatch: $name" }
            & cosign verify-blob $path --bundle "$path.sigstore.json" --certificate-identity $identity --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
            if ($LASTEXITCODE -ne 0) { throw "Sigstore verification failed: $name" }
            & gh attestation verify $path --repo $env:GITHUB_REPOSITORY --source-ref $env:BUILD_REF --source-digest $env:SOURCE_SHA --signer-workflow "github.com/$workflow"
            if ($LASTEXITCODE -ne 0) { throw "Provenance verification failed: $name" }
          }
          $exeHash = (Get-FileHash -LiteralPath (Join-Path 'dist' $env:RELEASE_EXE) -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = (Get-Content -LiteralPath (Join-Path 'dist' "$env:RELEASE_EXE.sha256") -Raw).Trim()
          if ($checksum -cne "$exeHash  $env:RELEASE_EXE") { throw 'OneFile checksum mismatch' }

      - name: Verify the published RC1 can select both RC2 packages
        shell: pwsh
        working-directory: wpf-net48
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tests/check_v0943_rc2_promotion.ps1 -Phase Preflight
          if ($LASTEXITCODE -ne 0) { throw 'RC1 preview preflight failed' }

      - name: Publish the exact tested bytes as a GitHub prerelease
        shell: pwsh
        working-directory: wpf-net48
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $exe = $env:RELEASE_EXE
          $zip = $env:RELEASE_ZIP
          $files = @("dist/$exe", "dist/$zip", "dist/$exe.sha256", 'dist/RELEASE-SHA256SUMS.txt',
            "dist/$exe.sigstore.json", "dist/$zip.sigstore.json")
          $notes = Join-Path $env:RUNNER_TEMP 'blockcraft-v0943-rc2-notes.md'
          @'
          ## v0.9.43 RC2 测试版

          - 保留 PCL 式导航和配色，调整首页实例卡片、快捷操作与更新页。窄窗口与 140% 缩放已通过布局回归。
          - 在「设置 → 更新设置」开启「校验完成后空闲时自动重启」，新版校验完成后会倒计时 8 秒。底栏可推迟安装，游戏、下载任务或未保存的皮肤编辑会延后重启。
          - 原位替换继续沿用安装位置和文件名。更新助手在确认新版窗口打开后清理旧 EXE 备份和暂存。新版更新助手支持清理已经不用的同版本 OneFile 解包缓存。
          - 皮肤页提供 360° 预览、2D 正反面、放大窗口和键盘控制。搜索可取消，下载进度显示在所选皮肤旁。

          Windows 10/11 x64 提供单文件 EXE 和完整 ZIP，附 SHA-256 与 Sigstore 验证材料。

          已装 RC1 时，在「设置 → 更新设置」选择「预览版」并保存，再进入「启动器更新」检查。
          '@ | Set-Content -LiteralPath $notes -Encoding utf8
          & gh release create $tag @files --repo $env:GITHUB_REPOSITORY --target $env:SOURCE_SHA --title 'BlockCraft Launcher v0.9.43 RC2（测试版）' --notes-file $notes --draft --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage the RC2 prerelease' }
          $draft = & gh release view $tag --repo $env:GITHUB_REPOSITORY --json databaseId,tagName,isDraft,isPrerelease,targetCommitish | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $draft.isDraft -or -not $draft.isPrerelease -or
              $draft.tagName -ne $tag -or $draft.targetCommitish -ne $env:SOURCE_SHA) {
            throw 'The draft points to an unexpected tag or source'
          }
          $remote = & gh api "repos/$env:GITHUB_REPOSITORY/releases/$($draft.databaseId)" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $remote.assets.Count -ne $files.Count) { throw 'Draft is missing assets' }
          foreach ($file in $files) {
            $name = Split-Path $file -Leaf
            $asset = @($remote.assets | Where-Object { $_.name -ceq $name })
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset.Count -ne 1 -or $asset[0].state -ne 'uploaded' -or $asset[0].digest -cne "sha256:$hash") {
              throw "Uploaded bytes do not match: $name"
            }
          }
          & gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the RC2 prerelease' }
          $published = & gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,isPrerelease,targetCommitish,url | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $published.isDraft -or -not $published.isPrerelease -or
              $published.tagName -ne $tag -or $published.targetCommitish -ne $env:SOURCE_SHA) {
            throw 'Published preview metadata is incorrect'
          }
          Write-Host "Published RC2: $($published.url)"

      - name: Wait for the anonymous preview update feed
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          $available = $false
          $wait = [Diagnostics.Stopwatch]::StartNew()
          do {
            try {
              $feed = Invoke-RestMethod -Uri $url -UserAgent 'BlockCraftLauncher-RC2-Public-Check' -TimeoutSec 15
              $preview = @($feed | Where-Object {
                $_.tag_name -ceq $env:RELEASE_TAG -and $_.prerelease -and -not $_.draft
              })
              if ($preview.Count -eq 1) {
                $names = @($preview[0].assets | Where-Object state -eq 'uploaded' | ForEach-Object name)
                $available = $names -ccontains $env:RELEASE_EXE -and $names -ccontains $env:RELEASE_ZIP -and
                  $names -ccontains 'RELEASE-SHA256SUMS.txt'
              }
            }
            catch { Write-Host ('Preview list request will retry: ' + $_.Exception.Message) }
            if (-not $available) { Start-Sleep -Seconds 8 }
          } while (-not $available -and $wait.Elapsed.TotalSeconds -lt 140)
          if (-not $available) { throw 'The anonymous update feed has not propagated RC2' }
          Write-Host "PASS: public preview feed contains $env:RELEASE_TAG and both packages"

      - name: Upgrade the published RC1 ZIP and OneFile through the preview channel
        shell: pwsh
        working-directory: wpf-net48
        timeout-minutes: 9
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tests/check_v0943_rc2_promotion.ps1 -Phase Live
          if ($LASTEXITCODE -ne 0) { throw 'Live RC1-to-RC2 upgrade verification failed' }
